description: |
  Two-stage feature flow — plan on opus, hand off, implement on sonnet one task at a time,
  review in a capped loop, open the PR. Opt-in rather than part of the default stack, because
  the sonnet default it sets is load-bearing for the implementing half and would otherwise
  change the model of every session in every repo that consumes the default stack.
skills:
  # The loop drives this rather than repeating it, so a stack carrying one without the
  # other renders a review that has nothing to run.
  - panel-code-review
  - review-implementation
  - open-pr
  # wrap-session-reviewer creates an AGENTS.md through this one when a module
  # has none, so open-pr's documentation step needs it present.
  - agents-md-creator
  - pr-review-resolver
agents:
  - wrap-session-reviewer
instructions:
  - git
