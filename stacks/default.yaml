description: |
  Default toolkit stack — the two-stage feature flow (plan on opus, hand off, implement on
  sonnet, review in a capped loop, open the PR and loop its review too), the workflow-agnostic
  skills around it, the plan-approval instruction, the session agents and the upstream
  skill-creator skill. The memory store and everything that reads it come from the memory stack
  this extends, and the setting that keeps Claude Code's authoring footers out of commits and
  pull requests comes from the no-attribution stack it extends.

  A session-start hook points git at the user's identity and signing key from the AGTK_GH_USER,
  AGTK_GH_EMAIL and AGTK_SIGNING_KEY_B64 variables (`agtk cloud init --render`). It does nothing
  unless one of them is set.

  It sets the session's default model to sonnet, because the implementing half of the flow is
  meant to land there and only /plan-feature's own frontmatter raises a session above it.
extends:
  # The memory store and its tooling. Extended rather than listed so a repo can
  # adopt memory on its own, and so the grants those definitions need travel
  # with them instead of living in a stack that knows nothing about them.
  - ./memory.yaml
  # Extended rather than listed so a repo can adopt the setting on its own.
  - ./no-attribution.yaml
skills:
  - agents-md-creator
  - challenge
  - panel-code-review
  - pr-review-resolver
  - tdd-bugfix
  - using-agentic-toolkit
  - wrap-session
  # The feature flow. Each is usable on its own — a handoff written by hand, a
  # review loop over any branch, shipping any finished branch — so they are
  # listed as skills rather than hidden behind the command that chains them.
  - write-handoff
  - implement-handoff
  - review-implementation
  - review-pull-request
  - open-pr
  - github.com/anthropics/skills.git/skills/skill-creator@main
agents:
  - wrap-session-reviewer
  - plan-reviewer
  - task-implementer
commands:
  - plan-feature
instructions:
  - comments-describe-code-not-its-history
  - git
  - instructions-are-rendered-not-edited
  - no-authoring-footers
  - plan-approval
  - rendered-output-stays-out-of-git
hooks:
  - cloud-init-claude-session-start
  - handoff-claude-session-start
  - no-authoring-footers-claude-pre-tool-use
settings:
  - skill-permissions
  - feature-flow-model
