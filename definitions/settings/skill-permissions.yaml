name: skill-permissions
description: Pre-approve the file and shell operations the bundled skills/agents need (memory-explorer store reads and candidate writes, backlog reporting, Serena memories, panel-code-review's model-free code-review commands, read-only gh calls) so they run without permission prompts.
platforms: [claude]
value:
  permissions:
    allow:
      - "Write(./.agents/memories/**)"
      - "Bash(agtk memory stats*)"
      - "Bash(agtk memory show *)"
      # Reporting only. `curate` is not pre-approved: it spends money and
      # rewrites notes/, so it stays a prompt the user answers deliberately.
      - "Bash(agtk memory candidates*)"
      # These two assume the default store location. A consumer that sets
      # `memory.root` needs its own entries for that path — permissions are
      # pre-approval, so the only cost of a miss is a prompt, never a block.
      - "Read(**/.agents/memory/INDEX.md)"
      - "Write(**/.agents/memory/candidates/**)"
      # The code-review subcommands that spend nothing: they read a manifest,
      # profile a change and say which panel would run. `run` is absent because
      # it costs money, and `approve` because a person types that one.
      - "Bash(agtk code-review panels*)"
      - "Bash(agtk code-review explain*)"
      - "Bash(agtk code-review signals*)"
      - "Bash(gh pr view *)"
