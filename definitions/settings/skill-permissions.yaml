name: skill-permissions
description: Pre-approve the file and shell operations the bundled skills/agents need (memory-explorer store reads and candidate writes, Serena memories, deep-code-review scripts, pr-code-review read-only gh calls) so they run without permission prompts.
platforms: [claude]
value:
  permissions:
    allow:
      - "Write(./.agents/memories/**)"
      - "Bash(agtk memory stats*)"
      - "Bash(agtk memory show *)"
      # These two assume the default store location. A consumer that sets
      # `memory.root` needs its own entries for that path — permissions are
      # pre-approval, so the only cost of a miss is a prompt, never a block.
      - "Read(**/.agents/memory/INDEX.md)"
      - "Write(**/.agents/memory/candidates/**)"
      - "Bash(git checkout *)"
      - "Bash(git hash-object *)"
      - "Bash(*/skills/deep-code-review/scripts/detect-parent.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/capture-diff.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/list-changed.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/find-convention-docs.sh*)"
      - "Bash(gh pr view *)"
      - "Bash(gh pr diff *)"
