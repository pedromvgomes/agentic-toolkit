name: skill-permissions
description: Pre-approve the file and shell operations the bundled skills/agents need (code-explorer code map, Serena memories, deep-code-review scripts, pr-code-review read-only gh calls) so they run without permission prompts.
platforms: [claude]
value:
  permissions:
    allow:
      - "Read(**/.agents/CODE-MAP.md)"
      - "Edit(**/.agents/CODE-MAP.md)"
      - "Write(./.agents/memories/**)"
      - "Bash(git checkout *)"
      - "Bash(git hash-object *)"
      - "Bash(*/skills/deep-code-review/scripts/detect-parent.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/capture-diff.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/list-changed.sh*)"
      - "Bash(*/skills/deep-code-review/scripts/find-convention-docs.sh*)"
      - "Bash(gh pr view *)"
      - "Bash(gh pr diff *)"
