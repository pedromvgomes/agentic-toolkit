name: memory-permissions
description: Pre-approve the memory store's read-only commands (the explorer's store reads and the session-end backlog report) so a delegation runs without permission prompts.
platforms: [claude]
value:
  permissions:
    allow:
      - "Bash(agtk memory stats*)"
      - "Bash(agtk memory show *)"
      # Reporting only. `curate` is not pre-approved: it spends money and
      # rewrites notes/, so it stays a prompt the user answers deliberately.
      - "Bash(agtk memory candidates*)"
      # The store's own paths are absent on purpose. They depend on
      # `memory.root`, which only the consumer's entry manifest sets, so a
      # literal here would be right for consumers who left the default and
      # wrong for the rest. The claude adapter appends them from the root it
      # resolves, whenever a stack contributes `permissions` at all — which
      # this definition is what guarantees for a consumer that adopts memory
      # and nothing else.
