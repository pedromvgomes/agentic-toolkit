name: no-attribution
description: Omit the commit trailer, the pull-request line and the claude.ai session link that Claude Code adds to published text, so commits and pull requests carry no authoring footer.
platforms: [claude]
value:
  # `commit` and `pr` take the text Claude Code appends, so an empty string is what
  # omits the co-author trailer and the pull-request line; a boolean fails settings
  # validation. `sessionUrl` is the boolean that suppresses the claude.ai session
  # link a cloud or Remote Control session appends to commits.
  #
  # Claude-only: the codex adapter copies every top-level key into
  # .codex/config.toml, which would turn `attribution` into a stray table there.
  attribution:
    commit: ""
    pr: ""
    sessionUrl: false
