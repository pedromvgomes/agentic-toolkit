name: no-attribution
description: Omit the commit trailer, the pull-request line and the claude.ai session link that Claude Code adds to published text, so commits and pull requests carry no authoring footer.
platforms: [claude]
value:
  # `sessionUrl` is the key that suppresses the claude.ai session link a cloud
  # or Remote Control session appends to commits; `commit` and `pr` cover the
  # co-author trailer and the pull-request line, in cloud and local sessions alike.
  #
  # Claude-only: the codex adapter copies every top-level key into
  # .codex/config.toml, which would turn `attribution` into a stray table there.
  attribution:
    commit: false
    pr: false
    sessionUrl: false
