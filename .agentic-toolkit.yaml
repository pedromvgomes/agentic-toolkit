# agentic-toolkit consumes its own definitions.
#
# The stacks are extended by local path rather than through an org aggregator:
# this repo IS the source, so a URL ref would fetch a pinned copy of itself and
# render yesterday's definitions over today's working tree — and it would make
# the toolkit's own setup depend on a repo it does not own.
extends:
  - ./stacks/default.yaml
  - ./stacks/plannotator.yaml
  - ./stacks/serena.yaml
  - ./stacks/rtk.yaml

# Both platforms, so a Codex reviewer on the panel reads the same
# definitions a Claude one does. Rendering for a platform is what puts
# this repo's instructions where that platform looks for them; a panel
# whose Codex reviewers ran without them would be reviewing this repo
# with less context than its Claude reviewers, and the disagreement
# between the two is the signal the panel exists to produce.
platforms:
  - claude
  - codex

# Scoped to this repo rather than to stacks/default.yaml: it describes
# agentic-toolkit's own layout, commands and boundaries, which is exactly
# what a consumer repo extending the default stack must not be told about
# its own tree.
instructions:
  - agentic-toolkit-repo

# `root` names a path outside every platform's rendered tree. The default,
# `.agents/memory`, puts committed notes inside the directory the codex
# adapter owns, where the ignore rule covering that tree reaches them.
#
# `agent` has no default because curation is the one operation that spends
# money, so an unconfigured repo is refused rather than guessed at.
memory:
  root: .memory
  agent: claudecode
