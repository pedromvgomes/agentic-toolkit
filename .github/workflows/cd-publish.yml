# cd-publish — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# cd-orchestration.yml, which verifies the tagged tree carries a passing
# gt/validated-tree attestation before this runs.
name: cd-publish

on:
  workflow_call:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # release.yml declared this at workflow level.
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: stage hand-written release notes (if present)
        # If docs/releases/v<X.Y.Z>.md exists, surface it via $RELEASE_NOTES
        # so goreleaser uses it instead of auto-generated notes.
        run: |
          tag="${GITHUB_REF##*/}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          fi
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: release --clean ${{ env.RELEASE_NOTES && format('--release-notes={0}', env.RELEASE_NOTES) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
