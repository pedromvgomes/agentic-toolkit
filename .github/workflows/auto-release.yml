# auto-release — releases the version whose notes were merged, and announces
# every tag left without a GitHub Release.
#
# A release is the merge of its notes (ADR-0030). Every push to main runs this
# workflow, and a `workflow_dispatch` on main runs it by hand, with `dry_run` to
# run the release's `verify` alone. Every run sweeps: it releases the version
# whose docs/releases/vX.Y.Z.md exists at the pushed commit and whose tag does
# not, and it finishes every tag that has notes and no GitHub Release. A
# failure rolls nothing back: the next push sweeps again from its own commit,
# and a re-run sweeps again at the original one.
#
# Releases are calls to the reusable release.yml, not workflows triggered by a
# tag: a tag pushed with GITHUB_TOKEN starts no workflow, so nothing triggered
# by a tag this workflow pushes would ever run.
name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the release's verify alone, writing nothing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One sweep at a time, and never cancel one in flight: a cancelled release can
# leave a version tagged but unannounced. A run that is queued and then
# replaced by a newer push is never missed, because the newer run sweeps
# everything the older one would have.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      finish: ${{ steps.plan.outputs.finish }}
    steps:
      # release.yml refuses to tag a commit that is not on main, so a dispatch
      # from another branch would plan a release that every job then fails.
      - name: The ref is main
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::${REF} is not refs/heads/main; only main is released"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: List the tags and the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git tag --list 'v*' > "${RUNNER_TEMP}/tags"
          gh api "repos/${REPO}/releases" --paginate --jq '.[].tag_name' > "${RUNNER_TEMP}/releases"

      - name: Plan the release
        id: plan
        run: |
          set -euo pipefail
          plan="$(.github/scripts/release/pending.sh docs/releases "${RUNNER_TEMP}/tags" "${RUNNER_TEMP}/releases")"
          echo "$plan"
          echo "release=$(jq -r '.release // ""' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "finish=$(jq -c '[.finish[] | {version: .}]' <<<"$plan")" >> "$GITHUB_OUTPUT"

      - name: Summarise the plan
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          FINISH: ${{ steps.plan.outputs.finish }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          {
            echo "## Release plan"
            if [[ "$DRY_RUN" == true ]]; then echo; echo "Dry run: the release runs verify alone."; fi
            echo
            if [[ -n "$RELEASE" ]]; then echo "- release: \`${RELEASE}\`"; else echo "- no version is pending"; fi
            if [[ "$FINISH" != "[]" ]]; then echo "- unannounced: $(jq -r 'map("`\(.version)`") | join(", ")' <<<"$FINISH")"; else echo "- no tag is unannounced"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The calling job grants `contents: write` so that release.yml's `tag` and
  # `release` jobs can hold it; its `verify` job narrows it to read.
  # `inputs.dry_run` is null on a push.
  release:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.release }}
      sha: ${{ github.sha }}
      mode: release
      dry_run: ${{ inputs.dry_run || false }}

  # An unannounced tag already exists, so finishing it waits for nothing and
  # runs beside the release. It never races the release on one tag: the release
  # is a version with no tag, and release.yml's `release-<version>` concurrency
  # group keeps a dispatched finish of the same tag apart from this one.
  finish:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.finish != '[]' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.finish) }}
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ matrix.version }}
      mode: finish
      dry_run: ${{ inputs.dry_run || false }}
