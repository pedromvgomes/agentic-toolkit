# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# The Go suite, moved from ci.yml, now also producing a coverage profile.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/toolkit/go.mod
          cache: true
      # Sourcestore + CLI tests shell out to `git` against file:// fixture
      # repos. setup-go's runner already has git on PATH, but pin a
      # default branch name so `git init -b main` matches local dev.
      - name: configure git
        run: git config --global init.defaultBranch main
      - run: go -C source/toolkit test ./...
