name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/toolkit/go.mod
          cache: true
      - name: stage hand-written release notes (if present)
        # If docs/releases/v<X.Y.Z>.md exists, surface it via $RELEASE_NOTES
        # so goreleaser uses it instead of auto-generated notes.
        run: |
          tag="${GITHUB_REF##*/}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          fi
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean ${{ env.RELEASE_NOTES && format('--release-notes={0}', env.RELEASE_NOTES) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
