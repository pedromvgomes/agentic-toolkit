# The roster agentic-toolkit holds itself to. This path is what `Load` reads
# instead of the manifest embedded in the binary, so this file governs every
# review of this repo — the embedded default is what a repo gets while it
# declares none of its own, and this repo declares this.
#
# A manifest is used whole. Prompt bodies stay shareable through `builtin:`
# references rather than through a merge algorithm, so there is one roster per
# repo and never half of two — which is why `conventions:` below is the whole
# list and not an addition to the default seven.
#
# Two rosters, one per provider, and the same panels and rules for each. The
# local pass is Claude and the pull request is codex, so a change is read by two
# models trained differently before anyone else sees it. Every model is named:
# a reviewer left on the CLI's default is a model nobody chose.
#
# Every panel names its twin on the other provider as its fallback, so a
# provider that blocks a run — a spent quota, a rejected token — is retried
# once on the other roster rather than left unavailable.
version: 1

reviewers:
  unified:     {provider: claudecode, model: sonnet, prompt: builtin:unified}
  correctness: {provider: claudecode, model: sonnet, prompt: builtin:correctness}
  security:    {provider: claudecode, model: opus,   prompt: builtin:security}
  performance: {provider: claudecode, model: sonnet, prompt: builtin:performance}

  unified-codex:     {provider: codex, model: sol,   prompt: builtin:unified}
  correctness-codex: {provider: codex, model: sol,   prompt: builtin:correctness}
  security-codex:    {provider: codex, model: astra, prompt: builtin:security}
  performance-codex: {provider: codex, model: sol,   prompt: builtin:performance}

judge:     {provider: claudecode, model: opus,   prompt: builtin:judge}
validator: {provider: claudecode, model: sonnet, prompt: builtin:validator}

# The codex panels judge and validate on codex, so a pull request is read and
# reconciled without the model that already reviewed it locally.
panels:
  quick:
    description: One Claude reviewer over all three axes. The pre-push pass, where being fast is what it is worth.
    reviewers: [unified]
    fallback: quick-codex
  standard:
    description: Correctness and security on Claude, each with its own scope.
    reviewers: [correctness, security]
    fallback: standard-codex
  deep:
    description: Every axis on Claude, run twice, so agreement between independent instances is the confidence signal.
    reviewers: [correctness, security, performance]
    quorum: 2
    fallback: deep-codex

  quick-codex:
    description: One codex reviewer over all three axes.
    reviewers: [unified-codex]
    judge:     {provider: codex, model: astra, prompt: builtin:judge}
    validator: {provider: codex, model: sol,   prompt: builtin:validator}
    fallback: quick
  standard-codex:
    description: Correctness and security on codex, each with its own scope. The second model's first look at the change.
    reviewers: [correctness-codex, security-codex]
    judge:     {provider: codex, model: astra, prompt: builtin:judge}
    validator: {provider: codex, model: sol,   prompt: builtin:validator}
    fallback: standard
  deep-codex:
    description: Every axis on codex, run twice, so agreement between independent instances is the confidence signal.
    reviewers: [correctness-codex, security-codex, performance-codex]
    quorum: 2
    judge:     {provider: codex, model: astra, prompt: builtin:judge}
    validator: {provider: codex, model: sol,   prompt: builtin:validator}
    fallback: deep

defaults:
  worktree: quick
  pr:       standard-codex

# `standard` is the ceiling a rule can reach on a pull request. The branch has
# already been through the local loop by the time it is opened, so a second
# every-axis-twice reading buys a re-read of code that was read deeply an hour
# ago. `deep-codex` stays a panel and stays `deep`'s fallback; reaching it on a
# pull request is `--panel deep-codex`, which is a person deciding this change
# is the exception.
#
# So the worktree rules and the pull-request rules are not symmetric, and
# `context` is what keeps each on its own side. A rule carries one combinator,
# so the context guard makes each rule an `all:` — which is why one criterion
# gets one rule rather than several being grouped.
#
# The rules raising to `standard-codex` cannot raise the panel while that is
# also the pull-request default. They still fire, and `explain` lists them. They
# are kept so lowering the default does not silently drop a criterion.
escalate:
  # Mistakes here are exploitable, or land on somebody who is not in the room,
  # or are indistinguishable from correct until production. Worktree only: this
  # is the reading that happens before anyone else sees the change, which is the
  # point at which looking harder is still cheaper than being wrong.
  - to: deep
    all:
      - signals: {in: [auth, crypto, concurrency, sensitive-data, fix-revert]}
      - context: {in: [worktree]}

  # No referencing_files rule. The count is unavailable for a change touching
  # any file type this build does not recognise, and a manifest that reads an
  # unavailable count is refused rather than read as low — so a single asset in
  # an unlisted format inside a definition bundle would stop the review from
  # starting at all. This catalog ships arbitrary files alongside definitions,
  # so that is reachable here in a way it is not in a repo of one language. A
  # review that runs without the blast-radius criterion is worth more than one
  # that refuses; changed_files and signals still raise.

  # Irreversible or wide, but the risk is not in the diff: a migration's cost is
  # the table it locks, and a pipeline's is what it can reach. The security
  # reviewer is the one with something to say, so this buys that rather than
  # every axis twice.
  #
  # `bugfix-lines` belongs here rather than beside `fix-revert`: touching a line
  # a routine repair last edited is a reason to read more of the change, not a
  # reason to read every axis of it twice.
  - to: standard
    all:
      - signals: {in: [migrations, ci-cd, iac, bugfix-lines]}
      - context: {in: [worktree]}
  - to: standard-codex
    all:
      - signals: {in: [migrations, ci-cd, iac, bugfix-lines]}
      - context: {in: [pr]}

  # Size alone. It raises to standard rather than deep, because bulk is a
  # reason to look at more of a change, not a reason to look harder at each
  # part of it.
  - to: standard
    all:
      - changed_files: {gte: 50}
      - context: {in: [worktree]}
  - to: standard-codex
    all:
      - changed_files: {gte: 50}
      - context: {in: [pr]}

# This repo's own written rules. Nominating them replaces the built-in default
# list, which names CLAUDE.md and AGENTS.md — both rendered from this catalog
# and both untracked, so at a base ref they are absent and a reviewer sees none
# of what they carry. The definitions below are the tracked sources those files
# are rendered from, and a nominated document that goes missing is reported
# rather than skipped.
conventions:
  - CONTEXT.md
  - definitions/instructions/agentic-toolkit-repo.md
  - definitions/instructions/git.md
  - definitions/instructions/comments-describe-code-not-its-history.md
  - definitions/instructions/memory-first-exploration.md
  - definitions/instructions/plan-approval.md
