id: triage-issue
name: Triage an issue
version: 1
status: published
triggers:
  - id: opened
    use: component.webhook
steps:
  - id: label
    use: component.script
    with:
      run: echo triage {{triggers.opened.inputs.issue}}
  - id: summarise
    use: component.agentic
    with:
      provider: claude-code
      prompt: "Summarise the labels: {{agtk.unwrapped(steps.label.stdout)}}"
      worktree: inherit
      agtk: none
