# A Function Manifest in hatua's format. A value reaches a prompt wrapped, so
# an input cannot pass itself off as an instruction; calling agtk.unwrapped is
# the opt-in that inserts it as written, and a Webhook registration still has
# to allow the input it is called on.
kind: function
namespace: agtk
summary: Functions that change how a value is placed into a prompt.
functions:
  - name: unwrapped
    summary: Insert a value into a prompt exactly as written, without the wrapping that marks it as data.
    params:
      - name: value
        type: text
        description: The value to insert.
    returns: text
